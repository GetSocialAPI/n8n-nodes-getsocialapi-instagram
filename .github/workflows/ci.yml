name: Check n8n community node
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Scan published n8n community package
        run: npx --yes @n8n/scan-community-package n8n-nodes-getsocialapi-instagram@0.2.1
