name: Release 0.2.1 and verify
on:
  push:
    paths:
      - '.github/workflows/release-0_2_1.yml'
permissions:
  contents: read
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
      - name: Update npm
        run: npm install --global npm@latest
      - name: Validate and build
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Missing NPM_TOKEN repository secret"
            exit 1
          fi
          npm publish --ignore-scripts --access public --provenance
      - name: Verify release against n8n requirements
        run: npx --yes @n8n/scan-community-package n8n-nodes-getsocialapi-instagram
